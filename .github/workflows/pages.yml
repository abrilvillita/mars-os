# Builds the static viewer and publishes it to GitHub Pages on every push to main.
# The static site has no backend: Gemini analysis and on-demand MOLA 463 m elevation are
# shown as unavailable there (run `npm run dev` locally for the full app).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
        env:
          VITE_BASE: /mars-os/
          # URL of the hosted backend (repository variable MARS_OS_API_BASE); empty = no backend
          VITE_API_BASE: ${{ vars.MARS_OS_API_BASE }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
